[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qforge"
version = "0.2.0"
description = "Toy educational quantum-circuit DSL compiler with verified optimization passes. Python stdlib only."
readme = "README.md"
license = "MIT"
authors = [{ name = "GreenPandaTech" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["quantum", "compiler", "dsl", "education", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qforge = "qforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
